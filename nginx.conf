
server {
    client_max_body_size 500M;  # 限制上传文件最大为 500MB，防止内存溢出
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（系统启动后默认加载）
    location / {
        try_files $uri $uri/ /index.html;
        
        # 极其重要：强制浏览器不对 HTML 文件进行缓存
        # 否则在使用 Vite + emptyOutDir:false 时，浏览器会读取旧版 index.html 并加载遗留的旧版 JS 文件
        if ($request_filename ~* .*\.(htm|html)$) {
            add_header Cache-Control "private, no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # 反向代理后端API（系统默认开放，运行于教学验证环境，不面向公网部署）
    location /api {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;  # 延长连接超时时间
    }

    # 健康检查
    location /health {
        proxy_pass http://app:8000/health;
    }
}
